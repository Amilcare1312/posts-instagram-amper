<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- MITO OU VERDADE tag -->
  <rect x="60" y="168" width="340" height="42" rx="6" fill="#FF7A1A"/>
  <text x="230" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">MITO OU VERDADE</text>

  <!-- Illustration: lightning bolt over unprotected roof vs. panel with SPDA/aterramento protected -->
  <g transform="translate(90,250)">
    <rect x="0" y="0" width="900" height="330" rx="10" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>

    <!-- left: roof with panel + lightning + X (mito: painel atrai raio) -->
    <g transform="translate(220,160)">
      <!-- roof -->
      <path d="M -120 70 L 0 -10 L 120 70 Z" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <rect x="-95" y="70" width="190" height="20" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <!-- panel on roof -->
      <rect x="-70" y="15" width="140" height="48" rx="4" fill="#1C5A8C" stroke="#8FA6BC" stroke-width="2" transform="rotate(-18 0 40)"/>
      <!-- lightning bolt -->
      <path d="M 40 -115 L 5 -35 L 35 -35 L -5 45" fill="none" stroke="#FF7A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- warning X -->
      <circle cx="75" cy="-95" r="26" fill="#C0392B"/>
      <path d="M 65 -105 L 85 -85 M 85 -105 L 65 -85" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="220" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9D6E3" text-anchor="middle">"PAINEL SOLAR ATRAI RAIO"</text>

    <!-- arrow -->
    <g transform="translate(450,165)">
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round"/>
      <path d="M 25 -18 L 55 0 L 25 18 Z" fill="#FF7A1A"/>
    </g>

    <!-- right: roof with panel + SPDA rod/grounding + shield check (verdade: protecao bem projetada) -->
    <g transform="translate(700,160)">
      <!-- roof -->
      <path d="M -120 70 L 0 -10 L 120 70 Z" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <rect x="-95" y="70" width="190" height="20" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <!-- panel on roof -->
      <rect x="-70" y="15" width="140" height="48" rx="4" fill="#1C5A8C" stroke="#8FA6BC" stroke-width="2" transform="rotate(-18 0 40)"/>
      <!-- SPDA captor rod -->
      <line x1="55" y1="-15" x2="55" y2="-95" stroke="#C9D6E3" stroke-width="6" stroke-linecap="round"/>
      <circle cx="55" cy="-100" r="6" fill="#C9D6E3"/>
      <!-- grounding line -->
      <line x1="55" y1="-15" x2="90" y2="65" stroke="#C9D6E3" stroke-width="5"/>
      <line x1="75" y1="80" x2="105" y2="80" stroke="#C9D6E3" stroke-width="5"/>
      <!-- shield with check -->
      <path d="M 0 -140 L 42 -122 L 42 -82 Q 42 -50 0 -32 Q -42 -50 -42 -82 L -42 -122 Z" fill="#FF7A1A" transform="translate(-10,-10)"/>
      <path d="M -20 -95 L -4 -79 L 22 -113" fill="none" stroke="#0A2540" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10,-10)"/>
    </g>
    <text x="700" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9D6E3" text-anchor="middle">SPDA + ATERRAMENTO PROTEGEM</text>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">PAINEL SOLAR NÃO</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">ATRAI RAIO.</text>
  <text x="60" y="800" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">PROTEÇÃO MAL FEITA, SIM</text>

  <line x1="60" y1="840" x2="1020" y2="840" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="890" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">Qualquer estrutura metálica no</text>
  <text x="60" y="925" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">telhado pode interagir com uma</text>
  <text x="60" y="960" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">descarga. O risco vem do SPDA</text>
  <text x="60" y="995" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">mal dimensionado, não do painel.</text>

  <text x="60" y="1045" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="21" fill="#C9D6E3">*SC está entre as regiões com maior incidência</text>
  <text x="60" y="1076" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="21" fill="#C9D6E3">de raios do Brasil (estimativa ilustrativa).</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#0A2540">AGENDA SEU DIAGNÓSTICO 📩</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
