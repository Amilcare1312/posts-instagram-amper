<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- MITO OU VERDADE tag -->
  <rect x="60" y="168" width="340" height="42" rx="6" fill="#FF7A1A"/>
  <text x="230" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">MITO OU VERDADE</text>

  <!-- Illustration: calendar/clock waiting vs. document with checkmark (regra de transição garantida) -->
  <g transform="translate(90,250)">
    <rect x="0" y="0" width="900" height="330" rx="10" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>

    <!-- left: calendar with question mark (esperar) -->
    <g transform="translate(220,165)">
      <rect x="-110" y="-110" width="220" height="190" rx="12" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <rect x="-110" y="-110" width="220" height="48" rx="12" fill="#3E6890"/>
      <rect x="-70" y="-128" width="14" height="36" rx="4" fill="#C9D6E3"/>
      <rect x="56" y="-128" width="14" height="36" rx="4" fill="#C9D6E3"/>
      <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="70" fill="#FF7A1A" text-anchor="middle">?</text>
    </g>
    <text x="220" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9D6E3" text-anchor="middle">"ESPERAR A REGRA</text>
    <text x="220" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9D6E3" text-anchor="middle">SE ESTABILIZAR"</text>

    <!-- arrow -->
    <g transform="translate(450,165)">
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round"/>
      <path d="M 25 -18 L 55 0 L 25 18 Z" fill="#FF7A1A"/>
    </g>

    <!-- right: document with checkmark + lock (lei 14.300 / regra de transição) -->
    <g transform="translate(700,150)">
      <rect x="-90" y="-120" width="180" height="230" rx="10" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <line x1="-60" y1="-80" x2="60" y2="-80" stroke="#8FA6BC" stroke-width="5"/>
      <line x1="-60" y1="-50" x2="60" y2="-50" stroke="#8FA6BC" stroke-width="5"/>
      <line x1="-60" y1="-20" x2="30" y2="-20" stroke="#8FA6BC" stroke-width="5"/>
      <circle cx="0" cy="60" r="42" fill="#FF7A1A"/>
      <path d="M -18 60 L -4 76 L 22 42" fill="none" stroke="#0A2540" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="700" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9D6E3" text-anchor="middle">LEI 14.300 JÁ GARANTE</text>
    <text x="700" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9D6E3" text-anchor="middle">REGRA DE TRANSIÇÃO</text>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">ESPERAR A REGRA</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">"SE ESTABILIZAR"</text>
  <text x="60" y="800" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="55" fill="#FF7A1A">SÓ ADIA SUA ECONOMIA</text>

  <line x1="60" y1="840" x2="1020" y2="840" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="890" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">Projeto homologado dentro da</text>
  <text x="60" y="925" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">regra vigente mantém as condições</text>
  <text x="60" y="960" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">pactuadas. Não existe mudança</text>
  <text x="60" y="995" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">retroativa pra quem já entrou.</text>

  <text x="60" y="1045" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="21" fill="#C9D6E3">*Payback estimado: 4-7 anos em média</text>
  <text x="60" y="1076" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="21" fill="#C9D6E3">tensão Grupo A/CELESC-D (ilustrativo).</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">CHAMA NO WHATSAPP 💬</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
