    <text x="440" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">ENERGIA + PRODUÇÃO, NO MESMO SOLO</text>
