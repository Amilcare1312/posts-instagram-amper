      <rect x="0" y="0" width="220" height="70" rx="5" fill="#0F2E4E" stroke="#C9D6E3" stroke-width="2" transform="rotate(-6 110 35)"/>
      <line x1="10" y1="25" x2="200" y2="10" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 110 35)"/>
      <line x1="10" y1="50" x2="200" y2="35" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 110 35)"/>
