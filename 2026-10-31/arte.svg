<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- SUSTENTABILIDADE tag -->
  <rect x="60" y="168" width="330" height="42" rx="6" fill="#FF7A1A"/>
  <text x="225" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">SUSTENTABILIDADE</text>

  <!-- Illustration: agrovoltaic - elevated panels with crops/pasture below -->
  <g transform="translate(90,250)">
    <!-- sun -->
    <circle cx="820" cy="10" r="26" fill="#FF7A1A"/>
    <line x1="820" y1="-32" x2="820" y2="-48" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="852" y1="-14" x2="864" y2="-26" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="788" y1="-14" x2="776" y2="-26" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="852" y1="34" x2="864" y2="46" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="788" y1="34" x2="776" y2="46" stroke="#FF7A1A" stroke-width="4"/>

    <!-- ground line -->
    <line x1="0" y1="330" x2="880" y2="330" stroke="#3E6890" stroke-width="3"/>

    <!-- elevated panel 1 -->
    <g transform="translate(40,60)">
      <line x1="20" y1="60" x2="0" y2="250" stroke="#C9D6E3" stroke-width="7"/>
      <line x1="200" y1="60" x2="220" y2="250" stroke="#C9D6E3" stroke-width="7"/>
      <rect x="0" y="0" width="220" height="70" rx="5" fill="#0F2E4E" stroke="#C9D6E3" stroke-width="2" transform="rotate(-6 110 35)"/>
      <line x1="10" y1="25" x2="200" y2="10" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 110 35)"/>
      <line x1="10" y1="50" x2="200" y2="35" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 110 35)"/>
    </g>

    <!-- elevated panel 2 -->
    <g transform="translate(300,60)">
      <line x1="20" y1="60" x2="0" y2="250" stroke="#C9D6E3" stroke-width="7"/>
      <line x1="200" y1="60" x2="220" y2="250" stroke="#C9D6E3" stroke-width="7"/>
      <rect x="0" y="0" width="220" height="70" rx="5" fill="#0F2E4E" stroke="#C9D6E3" stroke-width="2" transform="rotate(-6 110 35)"/>
      <line x1="10" y1="25" x2="200" y2="10" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 110 35)"/>
      <line x1="10" y1="50" x2="200" y2="35" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 110 35)"/>
