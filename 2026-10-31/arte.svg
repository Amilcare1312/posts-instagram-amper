    <!-- crop rows below panels -->
    <g stroke="#2E9E6B" stroke-width="7" stroke-linecap="round">
      <path d="M 20 310 Q 40 285 20 265" fill="none"/>
      <path d="M 70 315 Q 90 290 70 270" fill="none"/>
      <path d="M 120 310 Q 140 285 120 265" fill="none"/>
      <path d="M 170 315 Q 190 290 170 270" fill="none"/>
      <path d="M 260 310 Q 280 285 260 265" fill="none"/>
      <path d="M 310 315 Q 330 290 310 270" fill="none"/>
      <path d="M 360 310 Q 380 285 360 265" fill="none"/>
      <path d="M 410 315 Q 430 290 410 270" fill="none"/>
      <path d="M 460 310 Q 480 285 460 265" fill="none"/>
      <path d="M 510 315 Q 530 290 510 270" fill="none"/>
      <path d="M 560 310 Q 580 285 560 265" fill="none"/>
      <path d="M 610 315 Q 630 290 610 270" fill="none"/>
      <path d="M 660 310 Q 680 285 660 265" fill="none"/>
      <path d="M 710 315 Q 730 290 710 270" fill="none"/>
      <path d="M 760 310 Q 780 285 760 265" fill="none"/>
      <path d="M 810 315 Q 830 290 810 270" fill="none"/>
