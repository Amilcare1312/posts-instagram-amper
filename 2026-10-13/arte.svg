<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: gently declining degradation curve across 25 years -->
  <g transform="translate(90,190)">
    <!-- axis -->
    <line x1="0" y1="330" x2="420" y2="330" stroke="#3E6890" stroke-width="3"/>

    <!-- bars: Ano 1, Ano 10, Ano 25 - nearly full height, slight decline -->
    <rect x="20"  y="40" width="90" height="290" fill="#FF7A1A"/>
    <rect x="160" y="62" width="90" height="268" fill="#4C7AA6"/>
    <rect x="300" y="86" width="90" height="244" fill="#12395F" stroke="#C9D6E3" stroke-width="2"/>

    <text x="65"  y="362" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3" text-anchor="middle">ANO 1</text>
    <text x="205" y="362" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3" text-anchor="middle">ANO 10</text>
    <text x="345" y="362" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3" text-anchor="middle">ANO 25</text>

    <text x="65"  y="30" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF" text-anchor="middle">98%</text>
    <text x="205" y="52" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF" text-anchor="middle">93%</text>
    <text x="345" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF" text-anchor="middle">85%</text>

    <!-- sun icon above chart -->
    <g transform="translate(395,-30)">
      <circle cx="0" cy="0" r="22" fill="#FF7A1A"/>
      <g stroke="#FF7A1A" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-46"/>
        <line x1="24" y1="-24" x2="32" y2="-32"/>
        <line x1="-24" y1="-24" x2="-32" y2="-32"/>
        <line x1="34" y1="0" x2="46" y2="0"/>
      </g>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="46" fill="#FFFFFF">AOS 25 ANOS,</text>
  <text x="60" y="775" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="70" fill="#FF7A1A">84% A 87%</text>
  <text x="60" y="828" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF">DA GERAÇÃO ORIGINAL*</text>

  <line x1="60" y1="866" x2="1020" y2="866" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="925" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF">Painéis Tier 1 degradam pouco</text>
  <text x="60" y="962" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF">e de forma previsível — por isso</text>
  <text x="60" y="999" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF">entram na conta do payback.</text>

  <text x="60" y="1055" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="23" fill="#C9D6E3">*Estimativa ilustrativa (curva típica</text>
  <text x="60" y="1088" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="23" fill="#C9D6E3">Tier 1). Varia por fabricante.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">AGENDE SEU DIAGNÓSTICO</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
