<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: regulatory monitoring feeding into updated technical memorial -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">MONITORAMENTO REGULATÓRIO CONTÍNUO</text>

    <!-- regulation rows -->
    <circle cx="60" cy="95" r="10" fill="#FF7A1A"/>
    <text x="90" y="101" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF">ANEEL · REN 1000/2021 (Fio B)</text>

    <circle cx="60" cy="145" r="10" fill="#4C9EF5"/>
    <text x="90" y="151" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF">CELESC-D · procedimentos de acesso</text>

    <circle cx="60" cy="195" r="10" fill="#4C9EF5"/>
    <text x="90" y="201" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF">NBR 5419 / 15749 · normas técnicas</text>

    <circle cx="60" cy="245" r="10" fill="#4C9EF5"/>
    <text x="90" y="251" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF">NR-10 · segurança do trabalho</text>

    <!-- connecting line funneling into the memorial box -->
    <path d="M 60 255 C 60 300, 760 300, 760 285" fill="none" stroke="#7FA8CC" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- updated memorial box -->
    <rect x="620" y="60" width="300" height="225" rx="14" fill="#FF7A1A"/>
    <text x="770" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">MEMORIAL</text>
    <text x="770" y="170" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">TÉCNICO</text>
    <text x="770" y="200" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">ATUALIZADO</text>
    <circle cx="770" cy="235" r="18" fill="#0A2540"/>
    <text x="770" y="243" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FF7A1A" text-anchor="middle">✓</text>
  </g>

  <!-- Headline -->
  <text x="60" y="610" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">A NORMA MUDA.</text>
  <text x="60" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">A ENGENHARIA</text>
  <text x="60" y="734" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">SE ANTECIPA.</text>

  <line x1="60" y1="772" x2="1020" y2="772" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="835" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Equipe acompanha ANEEL, CELESC-D</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">e normas técnicas para manter cada</text>
  <text x="60" y="909" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">memorial técnico atualizado.</text>

  <text x="60" y="968" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">Isso é parte do processo de engenharia —</text>
  <text x="60" y="1003" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">não uma exceção.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">COMENTA AQUI 👇</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
