<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- MITO OU VERDADE tag -->
  <rect x="60" y="168" width="340" height="42" rx="6" fill="#FF7A1A"/>
  <text x="230" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">MITO OU VERDADE</text>

  <!-- Illustration: grid line broken (outage) vs building with solar + inverter OFF + BESS note -->
  <g transform="translate(90,250)">
    <rect x="0" y="0" width="900" height="330" rx="10" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>

    <!-- utility pole left -->
    <line x1="90" y1="50" x2="90" y2="240" stroke="#8FA6BC" stroke-width="8"/>
    <line x1="55" y1="70" x2="125" y2="70" stroke="#8FA6BC" stroke-width="8"/>

    <!-- grid wire going right, broken -->
    <line x1="90" y1="70" x2="400" y2="70" stroke="#8FA6BC" stroke-width="5"/>
    <line x1="470" y1="70" x2="740" y2="70" stroke="#8FA6BC" stroke-width="5" stroke-dasharray="10,10" opacity="0.5"/>

    <!-- break / X mark -->
    <g transform="translate(435,70)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#FF7A1A" stroke-width="10" stroke-linecap="round"/>
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#FF7A1A" stroke-width="10" stroke-linecap="round"/>
    </g>
    <text x="435" y="120" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#FF7A1A" text-anchor="middle">REDE CAIU</text>

    <!-- building with solar panels -->
    <g transform="translate(660,60)">
      <rect x="-80" y="60" width="160" height="110" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <!-- solar panel strip on roof -->
      <rect x="-90" y="30" width="180" height="30" rx="3" fill="#C9D6E3"/>
      <line x1="-70" y1="30" x2="-70" y2="60" stroke="#17436B" stroke-width="2"/>
      <line x1="-40" y1="30" x2="-40" y2="60" stroke="#17436B" stroke-width="2"/>
      <line x1="-10" y1="30" x2="-10" y2="60" stroke="#17436B" stroke-width="2"/>
      <line x1="20" y1="30" x2="20" y2="60" stroke="#17436B" stroke-width="2"/>
      <line x1="50" y1="30" x2="50" y2="60" stroke="#17436B" stroke-width="2"/>
      <line x1="80" y1="30" x2="80" y2="60" stroke="#17436B" stroke-width="2"/>
    </g>

    <!-- inverter box with OFF (power) icon -->
    <g transform="translate(660,250)">
      <rect x="-45" y="-30" width="90" height="60" rx="6" fill="#17436B" stroke="#5A7591" stroke-width="2"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#FF7A1A" stroke-width="5"/>
      <line x1="0" y1="-16" x2="0" y2="2" stroke="#FF7A1A" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="660" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF" text-anchor="middle">INVERSOR DESLIGA</text>

    <text x="660" y="20" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#C9D6E3" text-anchor="middle">PAINEL SOLAR (SEM BATERIA)</text>

    <!-- small battery note bottom right -->
    <g transform="translate(850,250)" opacity="0.85">
      <rect x="-28" y="-18" width="56" height="36" rx="5" fill="none" stroke="#C9D6E3" stroke-width="3" stroke-dasharray="5,5"/>
      <rect x="22" y="-8" width="8" height="16" rx="2" fill="#C9D6E3"/>
    </g>
    <text x="850" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#C9D6E3" text-anchor="middle">SÓ COM BESS</text>
    <text x="850" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#C9D6E3" text-anchor="middle">CONTINUA</text>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">SE A REDE CAI,</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">SEU SOLAR TAMBÉM</text>
  <text x="60" y="815" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="62" fill="#FF7A1A">DESLIGA</text>

  <line x1="60" y1="855" x2="1020" y2="855" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="905" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Sistema on-grid comum desliga</text>
  <text x="60" y="940" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">junto com a rede por norma de</text>
  <text x="60" y="975" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">segurança (anti-ilhamento). Quem</text>
  <text x="60" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">precisa de backup, precisa de BESS.</text>

  <text x="60" y="1060" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Comportamento padrão por segurança —</text>
  <text x="60" y="1091" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">não é defeito do sistema.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">COMENTA AQUI 👇</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
