<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- MITO VS VERDADE tag -->
  <rect x="60" y="168" width="300" height="42" rx="6" fill="#FF7A1A"/>
  <text x="210" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#0A2540" text-anchor="middle">MITO VS VERDADE</text>

  <!-- Illustration: crossed-out battery (myth: precisa de bateria) -> arrow -> grid-connected panel (truth: on-grid CELESC-D) -->
  <g transform="translate(70,245)">
    <!-- ground line -->
    <line x1="0" y1="300" x2="940" y2="300" stroke="#3E6890" stroke-width="3"/>

    <!-- Battery (left, dim, crossed out) -->
    <g transform="translate(15,60)" opacity="0.65">
      <rect x="20" y="30" width="110" height="180" rx="10" fill="#0F2E4E" stroke="#5A7591" stroke-width="6"/>
      <rect x="55" y="12" width="40" height="20" rx="4" fill="#5A7591"/>
      <rect x="38" y="60" width="74" height="30" rx="4" fill="#5A7591"/>
      <rect x="38" y="100" width="74" height="30" rx="4" fill="#5A7591"/>
      <rect x="38" y="140" width="74" height="30" rx="4" fill="#5A7591"/>
      <!-- cross out -->
      <line x1="-15" y1="10" x2="165" y2="245" stroke="#C9D6E3" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
      <text x="75" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">MEDO: "SÓ FUNCIONA</text>
      <text x="75" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">COM BATERIA"</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(205,160)">
      <line x1="0" y1="0" x2="55" y2="0" stroke="#FF7A1A" stroke-width="5"/>
      <polygon points="55,-10 75,0 55,10" fill="#FF7A1A"/>
    </g>

    <!-- Grid-connected panel (right): white card with sun+panel feeding straight into the grid -->
    <g transform="translate(320,10)">
      <rect x="0" y="35" width="600" height="220" rx="8" fill="#FFFFFF"/>
      <rect x="22" y="15" width="200" height="16" rx="4" fill="#C9D6E3"/>

      <!-- sun -->
      <circle cx="90" cy="105" r="22" fill="#FF7A1A"/>
      <line x1="90" y1="68" x2="90" y2="54" stroke="#FF7A1A" stroke-width="5"/>
      <line x1="122" y1="82" x2="133" y2="71" stroke="#FF7A1A" stroke-width="5"/>
      <line x1="58" y1="82" x2="47" y2="71" stroke="#FF7A1A" stroke-width="5"/>

      <!-- panel -->
      <rect x="40" y="150" width="100" height="60" rx="4" fill="#0A2540"/>
      <line x1="40" y1="170" x2="140" y2="170" stroke="#5A7591" stroke-width="2"/>
      <line x1="40" y1="190" x2="140" y2="190" stroke="#5A7591" stroke-width="2"/>
      <line x1="73" y1="150" x2="73" y2="210" stroke="#5A7591" stroke-width="2"/>
      <line x1="106" y1="150" x2="106" y2="210" stroke="#5A7591" stroke-width="2"/>

      <!-- straight line to grid pole -->
      <line x1="140" y1="180" x2="330" y2="180" stroke="#0A2540" stroke-width="5"/>
      <g transform="translate(345,135)">
        <line x1="0" y1="0" x2="0" y2="90" stroke="#0A2540" stroke-width="7"/>
        <line x1="-28" y1="18" x2="28" y2="18" stroke="#0A2540" stroke-width="6"/>
        <line x1="-20" y1="38" x2="20" y2="38" stroke="#0A2540" stroke-width="6"/>
        <line x1="0" y1="18" x2="-24" y2="-6" stroke="#0A2540" stroke-width="4"/>
        <line x1="0" y1="38" x2="20" y2="10" stroke="#0A2540" stroke-width="4"/>
      </g>
      <text x="300" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#0A2540">REDE CELESC-D</text>

      <circle cx="540" cy="140" r="46" fill="#FF7A1A"/>
      <path d="M 516 140 L 534 158 L 566 122" stroke="#0A2540" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="320" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#C9D6E3">SISTEMA ON-GRID CONECTADO DIRETO À REDE</text>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#FFFFFF">SOLAR SEM</text>
  <text x="60" y="755" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#FFFFFF">BATERIA TAMBÉM</text>
  <text x="60" y="828" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="62" fill="#FF7A1A">FUNCIONA.</text>

  <line x1="60" y1="865" x2="1020" y2="865" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="915" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">A maioria dos projetos é on-grid:</text>
  <text x="60" y="950" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">conecta direto na rede CELESC-D,</text>
  <text x="60" y="985" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">gera, injeta o excedente e usa os</text>
  <text x="60" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">créditos para abater a conta.</text>

  <text x="60" y="1070" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*BESS é indicado em casos específicos:</text>
  <text x="60" y="1101" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">backup de cargas essenciais ou controle</text>
  <text x="60" y="1132" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">de pico de demanda, não todo projeto.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#0A2540">CONHEÇA NO SITE ✅</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
