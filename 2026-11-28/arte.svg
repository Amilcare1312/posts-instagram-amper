<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
    <marker id="arrowhead3" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#FF7A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- SUSTENTABILIDADE tag -->
  <rect x="60" y="168" width="330" height="42" rx="6" fill="#FF7A1A"/>
  <text x="225" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">SUSTENTABILIDADE</text>

  <!-- Illustration: degraded land -> arrow -> solar field -->
  <g transform="translate(60,250)">
    <!-- sun -->
    <circle cx="95" cy="10" r="26" fill="#FF7A1A"/>
    <line x1="95" y1="-34" x2="95" y2="-50" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="129" y1="-10" x2="142" y2="-20" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="61" y1="-10" x2="48" y2="-20" stroke="#FF7A1A" stroke-width="4"/>

    <!-- ground line -->
    <line x1="0" y1="340" x2="940" y2="340" stroke="#3E6890" stroke-width="3"/>

    <!-- LEFT: degraded mining land -->
    <g transform="translate(10,150)">
      <rect x="0" y="130" width="220" height="40" rx="3" fill="#123A5E" stroke="#3E6890" stroke-width="2"/>
      <path d="M 0 130 L 40 90 L 75 130 Z" fill="#1C2E3A" stroke="#5A7591" stroke-width="2"/>
      <path d="M 75 130 L 125 70 L 170 130 Z" fill="#273B48" stroke="#5A7591" stroke-width="2"/>
      <path d="M 150 130 L 190 100 L 220 130 Z" fill="#1C2E3A" stroke="#5A7591" stroke-width="2"/>
      <circle cx="55" cy="150" r="5" fill="#5A7591"/>
      <circle cx="140" cy="155" r="4" fill="#5A7591"/>
      <circle cx="190" cy="148" r="4.5" fill="#5A7591"/>
      <text x="110" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#C9D6E3">MINERAÇÃO</text>
      <text x="110" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#C9D6E3">DESATIVADA</text>
    </g>

    <!-- arrow: degraded land to solar field -->
    <path d="M 245 290 L 395 290" stroke="#FF7A1A" stroke-width="4" fill="none" marker-end="url(#arrowhead3)"/>

    <!-- RIGHT: solar field on same land -->
    <g transform="translate(420,150)">
      <rect x="0" y="100" width="500" height="70" rx="4" fill="#123A5E" stroke="#3E6890" stroke-width="2"/>
      <g transform="translate(10,40)">
        <path d="M 0 90 L 45 50 L 150 50 L 150 95 L 0 100 Z" fill="#0A2540" stroke="#3E6890" stroke-width="2"/>
        <g transform="translate(15,60)">
          <rect x="0" y="0" width="120" height="32" rx="2" fill="#123A5E" stroke="#FF7A1A" stroke-width="2"/>
          <line x1="30" y1="0" x2="30" y2="32" stroke="#5A7591" stroke-width="1.5"/>
          <line x1="60" y1="0" x2="60" y2="32" stroke="#5A7591" stroke-width="1.5"/>
          <line x1="90" y1="0" x2="90" y2="32" stroke="#5A7591" stroke-width="1.5"/>
        </g>
      </g>
      <g transform="translate(180,40)">
        <path d="M 0 90 L 45 50 L 150 50 L 150 95 L 0 100 Z" fill="#0A2540" stroke="#3E6890" stroke-width="2"/>
        <g transform="translate(15,60)">
          <rect x="0" y="0" width="120" height="32" rx="2" fill="#123A5E" stroke="#FF7A1A" stroke-width="2"/>
          <line x1="30" y1="0" x2="30" y2="32" stroke="#5A7591" stroke-width="1.5"/>
          <line x1="60" y1="0" x2="60" y2="32" stroke="#5A7591" stroke-width="1.5"/>
          <line x1="90" y1="0" x2="90" y2="32" stroke="#5A7591" stroke-width="1.5"/>
        </g>
      </g>
      <g transform="translate(350,40)">
        <path d="M 0 90 L 45 50 L 150 50 L 150 95 L 0 100 Z" fill="#0A2540" stroke="#3E6890" stroke-width="2"/>
        <g transform="translate(15,60)">
          <rect x="0" y="0" width="120" height="32" rx="2" fill="#123A5E" stroke="#FF7A1A" stroke-width="2"/>
          <line x1="30" y1="0" x2="30" y2="32" stroke="#5A7591" stroke-width="1.5"/>
          <line x1="60" y1="0" x2="60" y2="32" stroke="#5A7591" stroke-width="1.5"/>
          <line x1="90" y1="0" x2="90" y2="32" stroke="#5A7591" stroke-width="1.5"/>
        </g>
      </g>
      <text x="250" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="18" fill="#C9D6E3">USINA SOLAR</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="705" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">SOLO DEGRADADO,</text>
  <text x="60" y="753" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">FUTURO</text>
  <text x="60" y="830" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="70" fill="#FF7A1A">RENOVÁVEL</text>

  <line x1="60" y1="868" x2="1020" y2="868" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="918" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Áreas de mineração desativadas no</text>
  <text x="60" y="953" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Sul de SC podem virar usinas solares —</text>
  <text x="60" y="988" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">sem disputar espaço com lavoura,</text>
  <text x="60" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">pecuária ou vegetação nativa.</text>

  <text x="60" y="1073" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*1 hectare plano pode abrigar entre 0,5</text>
  <text x="60" y="1104" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">e 1 MW solar instalado, variando com a</text>
  <text x="60" y="1135" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">tecnologia e o equipamento (estimativa).</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#0A2540">COMENTA AQUI 👇</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
