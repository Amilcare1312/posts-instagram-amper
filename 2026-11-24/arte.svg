<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- DADO DO DIA tag -->
  <rect x="60" y="168" width="230" height="42" rx="6" fill="#FF7A1A"/>
  <text x="175" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#0A2540" text-anchor="middle">DADO DO DIA</text>

  <!-- Illustration: demand gauge exceeding limit -> BESS absorbs peak -> penalty avoided -->
  <g transform="translate(70,245)">
    <rect x="0" y="0" width="940" height="330" rx="8" fill="#FFFFFF"/>

    <!-- Gauge: demanda ultrapassada -->
    <g transform="translate(155,165)">
      <path d="M -95 10 A 95 95 0 0 1 95 10" fill="none" stroke="#EEF3F8" stroke-width="22"/>
      <path d="M 10 -94 A 95 95 0 0 1 95 10" fill="none" stroke="#C0392B" stroke-width="22"/>
      <line x1="0" y1="0" x2="65" y2="-68" stroke="#0A2540" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="10" fill="#0A2540"/>
      <text x="0" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#0A2540">DEMANDA</text>
      <text x="0" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#C0392B">ULTRAPASSADA</text>
    </g>

    <!-- Arrow -->
    <line x1="290" y1="165" x2="370" y2="165" stroke="#C9D6E3" stroke-width="5"/>
    <polygon points="370,152 395,165 370,178" fill="#C9D6E3"/>

    <!-- Battery icon: BESS corta o pico -->
    <g transform="translate(480,45)">
      <rect x="0" y="0" width="150" height="230" rx="10" fill="#0A2540"/>
      <rect x="55" y="-16" width="40" height="16" rx="3" fill="#0A2540"/>
      <rect x="18" y="130" width="114" height="80" rx="6" fill="#FF7A1A"/>
      <path d="M 95 25 L 55 115 L 85 115 L 55 195 L 110 110 L 78 110 Z" fill="#FFFFFF"/>
      <text x="75" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#0A2540">BESS</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="660" y1="165" x2="740" y2="165" stroke="#C9D6E3" stroke-width="5"/>
    <polygon points="740,152 765,165 740,178" fill="#C9D6E3"/>

    <!-- Check seal: multa evitada -->
    <g transform="translate(850,110)">
      <circle cx="0" cy="0" r="75" fill="#0A2540"/>
      <path d="M -32 2 L -8 28 L 34 -26" fill="none" stroke="#FF7A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#0A2540">SEM MULTA</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">ULTRAPASSAR A DEMANDA</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">CONTRATADA PODE CUSTAR</text>
  <text x="60" y="825" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="68" fill="#FF7A1A">2 A 3X A TARIFA*</text>

  <line x1="60" y1="865" x2="1020" y2="865" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="915" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">O excedente sobre a demanda</text>
  <text x="60" y="950" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">contratada é cobrado por uma</text>
  <text x="60" y="985" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">tarifa bem mais alta. FV + BESS</text>
  <text x="60" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">bem dimensionados ajudam a evitar.</text>

  <text x="60" y="1070" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="21" fill="#C9D6E3">*Estimativa ilustrativa sobre o excedente de</text>
  <text x="60" y="1101" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="21" fill="#C9D6E3">demanda, Grupo A/CELESC-D. Não é valor oficial.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#0A2540">FALA COM A GENTE NO WHATSAPP 💬</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
