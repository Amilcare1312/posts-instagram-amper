<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: rising bar chart with sun and percent badge -->
  <g transform="translate(90,190)">
    <!-- axis -->
    <line x1="0" y1="330" x2="420" y2="330" stroke="#3E6890" stroke-width="3"/>

    <!-- bars ascending -->
    <rect x="20"  y="240" width="60" height="90"  fill="#12395F" stroke="#C9D6E3" stroke-width="2"/>
    <rect x="120" y="190" width="60" height="140" fill="#12395F" stroke="#C9D6E3" stroke-width="2"/>
    <rect x="220" y="120" width="60" height="210" fill="#12395F" stroke="#C9D6E3" stroke-width="2"/>
    <rect x="320" y="30"  width="60" height="300" fill="#FF7A1A"/>

    <!-- little sun above last bar -->
    <g transform="translate(350,0)">
      <circle cx="0" cy="0" r="20" fill="#FF7A1A"/>
      <g stroke="#FF7A1A" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-32" x2="0" y2="-44"/>
        <line x1="22" y1="-22" x2="30" y2="-30"/>
        <line x1="-22" y1="-22" x2="-30" y2="-30"/>
      </g>
    </g>

    <!-- percent badge -->
    <circle cx="80" cy="90" r="46" fill="#FF7A1A"/>
    <text x="80" y="102" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#0A2540" text-anchor="middle">%</text>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">TIR ESTIMADA DE</text>
  <text x="60" y="775" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="74" fill="#FF7A1A">15% A 30%</text>
  <text x="60" y="837" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">AO ANO*</text>

  <line x1="60" y1="875" x2="1020" y2="875" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="935" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF">Retorno estimado do capital investido</text>
  <text x="60" y="972" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF">em autoconsumo FV para Grupo A,</text>
  <text x="60" y="1009" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#FFFFFF">conectado via CELESC-D.</text>

  <text x="60" y="1065" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="23" fill="#C9D6E3">*Estimativa ilustrativa. Depende de</text>
  <text x="60" y="1098" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="23" fill="#C9D6E3">estudo de viabilidade específico.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">COMENTA AQUI 👇</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
