<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- INSTITUCIONAL tag -->
  <rect x="60" y="168" width="300" height="42" rx="6" fill="#FF7A1A"/>
  <text x="210" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">INSTITUCIONAL</text>

  <!-- Illustration: defective inverter (left, flagged) -> arrow -> Amper engineering handling RMA with manufacturer (right) -->
  <g transform="translate(90,245)">
    <!-- ground line -->
    <line x1="0" y1="300" x2="440" y2="300" stroke="#3E6890" stroke-width="3"/>

    <!-- Defective equipment (left) -->
    <g transform="translate(15,70)">
      <rect x="0" y="40" width="160" height="190" rx="8" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>
      <!-- inverter display -->
      <rect x="20" y="60" width="120" height="40" rx="4" fill="#17416B" stroke="#5A7591" stroke-width="1.5"/>
      <!-- vents -->
      <line x1="20" y1="120" x2="140" y2="120" stroke="#5A7591" stroke-width="4"/>
      <line x1="20" y1="134" x2="140" y2="134" stroke="#5A7591" stroke-width="4"/>
      <line x1="20" y1="148" x2="140" y2="148" stroke="#5A7591" stroke-width="4"/>
      <!-- fault warning triangle -->
      <g transform="translate(80,178)">
        <polygon points="0,-28 28,22 -28,22" fill="#B64A1F"/>
        <rect x="-3.5" y="-14" width="7" height="22" fill="#FFFFFF"/>
        <circle cx="0" cy="14" r="3.5" fill="#FFFFFF"/>
      </g>
      <text x="80" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">EQUIPAMENTO</text>
      <text x="80" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">COM DEFEITO</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(200,170)">
      <line x1="0" y1="0" x2="55" y2="0" stroke="#FF7A1A" stroke-width="5"/>
      <polygon points="55,-10 75,0 55,10" fill="#FF7A1A"/>
    </g>

    <!-- Amper engineering conducting RMA (right): document + headset bridging to manufacturer -->
    <g transform="translate(300,45)">
      <!-- sun -->
      <circle cx="65" cy="-15" r="18" fill="#FF7A1A"/>
      <line x1="65" y1="-42" x2="65" y2="-54" stroke="#FF7A1A" stroke-width="4"/>
      <line x1="88" y1="-32" x2="97" y2="-41" stroke="#FF7A1A" stroke-width="4"/>
      <line x1="42" y1="-32" x2="33" y2="-41" stroke="#FF7A1A" stroke-width="4"/>

      <!-- clipboard with RMA form -->
      <rect x="0" y="25" width="150" height="150" rx="8" fill="#FFFFFF"/>
      <rect x="55" y="15" width="40" height="16" rx="4" fill="#C9D6E3"/>
      <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0A2540">
        <rect x="18" y="50" width="114" height="7" fill="#C9D6E3"/>
        <rect x="18" y="68" width="95" height="7" fill="#C9D6E3"/>
        <rect x="18" y="86" width="105" height="7" fill="#C9D6E3"/>
        <!-- stamp / approved -->
        <circle cx="105" cy="140" r="30" fill="none" stroke="#2E7D4F" stroke-width="4" transform="rotate(-18 105 140)"/>
        <path d="M 90 140 L 100 150 L 122 125" stroke="#2E7D4F" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- headset bridging to manufacturer -->
      <g transform="translate(118,28)">
        <path d="M -16 6 A 16 16 0 0 1 16 6" fill="none" stroke="#FF7A1A" stroke-width="5"/>
        <rect x="-20" y="4" width="9" height="16" rx="3" fill="#FF7A1A"/>
        <rect x="11" y="4" width="9" height="16" rx="3" fill="#FF7A1A"/>
        <line x1="16" y1="18" x2="16" y2="30" stroke="#FF7A1A" stroke-width="4"/>
        <line x1="16" y1="30" x2="4" y2="30" stroke="#FF7A1A" stroke-width="4"/>
      </g>

      <text x="75" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">RMA CONDUZIDO</text>
      <text x="75" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">PELA AMPER</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">A GARANTIA NÃO</text>
  <text x="60" y="748" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">TERMINA NA</text>
  <text x="60" y="825" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="66" fill="#FF7A1A">INSTALAÇÃO</text>

  <line x1="60" y1="865" x2="1020" y2="865" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="915" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Defeito em módulo ou inversor?</text>
  <text x="60" y="950" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Nossa engenharia documenta,</text>
  <text x="60" y="985" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">aciona o fabricante e acompanha</text>
  <text x="60" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">até a substituição do equipamento.</text>

  <text x="60" y="1070" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Prazo médio de 2 a 6 semanas entre</text>
  <text x="60" y="1101" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">abertura e substituição — estimativa</text>
  <text x="60" y="1132" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">ilustrativa, varia por fabricante.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">AGENDE SEU DIAGNÓSTICO 🔧</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
