<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: paused factory (myth) vs. running factory with solar + gear (truth) -->
  <g transform="translate(70,185)">
    <!-- paused factory -->
    <g transform="translate(0,20)">
      <rect x="10" y="90" width="220" height="90" fill="#12395F" stroke="#C9D6E3" stroke-width="4"/>
      <polyline points="10,90 60,40 110,90" fill="none" stroke="#C9D6E3" stroke-width="4"/>
      <polyline points="110,90 160,40 210,90" fill="none" stroke="#C9D6E3" stroke-width="4"/>
      <rect x="148" y="8" width="20" height="42" fill="#12395F" stroke="#C9D6E3" stroke-width="3"/>
      <!-- pause icon -->
      <rect x="95" y="110" width="18" height="50" fill="#C9D6E3"/>
      <rect x="127" y="110" width="18" height="50" fill="#C9D6E3"/>
      <!-- cross out -->
      <line x1="-15" y1="5" x2="255" y2="195" stroke="#C9D6E3" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- plus sign -->
    <g transform="translate(290,90)">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#FF7A1A" stroke-width="8" stroke-linecap="round"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#FF7A1A" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- running factory with solar panel and gear, plus checkmark badge -->
    <g transform="translate(360,30)">
      <rect x="10" y="100" width="220" height="90" fill="#0A2540" stroke="#FF7A1A" stroke-width="5"/>
      <polyline points="10,100 60,50 110,100" fill="none" stroke="#C9D6E3" stroke-width="4"/>
      <polyline points="110,100 160,50 210,100" fill="none" stroke="#C9D6E3" stroke-width="4"/>
      <g transform="rotate(-6 95 75)">
        <rect x="60" y="60" width="70" height="30" rx="3" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
        <line x1="60" y1="75" x2="130" y2="75" stroke="#FF7A1A" stroke-width="1.5"/>
        <line x1="95" y1="60" x2="95" y2="90" stroke="#FF7A1A" stroke-width="1.5"/>
      </g>
      <g transform="translate(150,135)">
        <circle cx="0" cy="0" r="22" fill="none" stroke="#C9D6E3" stroke-width="6"/>
        <circle cx="0" cy="0" r="8" fill="#C9D6E3"/>
        <g stroke="#C9D6E3" stroke-width="6" stroke-linecap="round">
          <line x1="0" y1="-30" x2="0" y2="-22"/>
          <line x1="0" y1="22" x2="0" y2="30"/>
          <line x1="-30" y1="0" x2="-22" y2="0"/>
          <line x1="30" y1="0" x2="22" y2="0"/>
          <line x1="-21" y1="-21" x2="-16" y2="-16"/>
          <line x1="21" y1="21" x2="16" y2="16"/>
          <line x1="-21" y1="21" x2="-16" y2="16"/>
          <line x1="21" y1="-21" x2="16" y2="-16"/>
        </g>
      </g>
      <circle cx="265" cy="190" r="42" fill="#FF7A1A"/>
      <path d="M245 190 L260 205 L288 172" stroke="#0A2540" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#FFFFFF">INSTALAR SOLAR</text>
  <text x="60" y="762" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#FFFFFF">NÃO PARA A</text>
  <text x="60" y="824" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#FF7A1A">PRODUÇÃO.</text>

  <line x1="60" y1="862" x2="1020" y2="862" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="925" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Desligamentos são pontuais,</text>
  <text x="60" y="962" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">programados e coordenados</text>
  <text x="60" y="999" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">com a equipe de manutenção.</text>

  <text x="60" y="1055" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">Cronograma definido no projeto</text>
  <text x="60" y="1090" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">executivo, caso a caso.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">SALVA ESSE POST 📌</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
