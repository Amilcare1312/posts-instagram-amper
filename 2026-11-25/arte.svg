<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- CASO DE SUCESSO tag -->
  <rect x="60" y="168" width="330" height="42" rx="6" fill="#FF7A1A"/>
  <text x="225" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#0A2540" text-anchor="middle">CASO DE SUCESSO</text>

  <!-- Illustration: tear industrial + BESS evitando parada por afundamento de tensao -->
  <g transform="translate(70,245)">
    <rect x="0" y="0" width="940" height="330" rx="8" fill="#FFFFFF"/>

    <!-- Loom / textile machine icon -->
    <g transform="translate(220,55)">
      <rect x="-130" y="110" width="260" height="110" rx="6" fill="#0A2540"/>
      <rect x="-100" y="40" width="30" height="80" fill="#0A2540"/>
      <rect x="70" y="40" width="30" height="80" fill="#0A2540"/>
      <!-- fabric roll -->
      <circle cx="-40" cy="60" r="26" fill="#FF7A1A"/>
      <circle cx="40" cy="60" r="26" fill="#FF7A1A"/>
      <rect x="-40" y="56" width="80" height="8" fill="#0A2540"/>
      <!-- voltage sag warning -->
      <circle cx="0" cy="-10" r="24" fill="#FF7A1A"/>
      <path d="M -6,-22 L -14,-6 L -4,-6 L -10,10 L 10,-10 L 0,-10 Z" fill="#0A2540"/>
    </g>

    <!-- Arrow -->
    <line x1="500" y1="150" x2="580" y2="150" stroke="#C9D6E3" stroke-width="5"/>
    <polygon points="580,137 605,150 580,163" fill="#C9D6E3"/>

    <!-- BESS battery bank icon (solution) -->
    <g transform="translate(730,60)">
      <rect x="-70" y="20" width="140" height="170" rx="10" fill="#0A2540" stroke="#FF7A1A" stroke-width="4"/>
      <rect x="-30" y="5" width="60" height="18" rx="4" fill="#0A2540" stroke="#FF7A1A" stroke-width="4"/>
      <rect x="-45" y="45" width="90" height="26" fill="#FF7A1A"/>
      <rect x="-45" y="85" width="90" height="26" fill="#FF7A1A"/>
      <rect x="-45" y="125" width="90" height="26" fill="#FF7A1A"/>
      <text x="0" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540">BESS</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">LINHA DE PRODUÇÃO</text>
  <text x="60" y="742" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">PAROU DE TRAVAR</text>
  <text x="60" y="828" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="66" fill="#FF7A1A">FV + BESS NO</text>
  <text x="60" y="896" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="66" fill="#FF7A1A">LUGAR CERTO</text>

  <line x1="60" y1="930" x2="1020" y2="930" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="980" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">Indústria têxtil genérica em SC:</text>
  <text x="60" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">micro-quedas de tensão travavam</text>
  <text x="60" y="1050" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">o tear. BESS assumiu a carga</text>
  <text x="60" y="1085" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">crítica nesses instantes.</text>

  <text x="60" y="1135" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="20" fill="#C9D6E3">*Exemplo genérico, sem dados reais de cliente.</text>
  <text x="60" y="1165" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="20" fill="#C9D6E3">Números são estimativas ilustrativas.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="33" fill="#0A2540">VISITE NOSSO SITE 🔗</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
