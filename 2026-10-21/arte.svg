<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: demand curve with spike being shaved by battery -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">DEMANDA DA FÁBRICA (kW)</text>

    <!-- contracted demand limit (dashed) -->
    <line x1="40" y1="170" x2="700" y2="170" stroke="#C9D6E3" stroke-width="2" stroke-dasharray="8,8"/>
    <text x="710" y="176" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9D6E3">LIMITE</text>

    <!-- demand curve: baseline, spike (without BESS) dashed orange, shaved curve solid orange -->
    <path d="M40 220 L140 220 L160 110 L200 110 L220 220 L420 220 L440 100 L480 100 L500 220 L700 220"
          fill="none" stroke="#C9507A" stroke-width="4" stroke-dasharray="5,6" opacity="0.85"/>
    <path d="M40 220 L140 220 L160 190 L200 190 L220 220 L420 220 L440 185 L480 185 L500 220 L700 220"
          fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="150" y="95" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">pico sem BESS</text>
    <text x="150" y="265" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">curva achatada pelo BESS</text>

    <!-- battery icon -->
    <g transform="translate(780,70)">
      <rect x="0" y="20" width="130" height="190" rx="12" fill="#0A2540" stroke="#C9D6E3" stroke-width="3"/>
      <rect x="40" y="6" width="50" height="16" rx="4" fill="#C9D6E3"/>
      <rect x="18" y="130" width="94" height="65" rx="6" fill="#FF7A1A"/>
      <rect x="18" y="90" width="94" height="30" rx="4" fill="#4C7AA6"/>
      <rect x="18" y="55" width="94" height="25" rx="4" fill="#3E6890"/>
      <text x="65" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C9D6E3" text-anchor="middle">BESS</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="610" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">A BATERIA</text>
  <text x="60" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">CORTOU O PICO</text>
  <text x="60" y="734" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">DA MULTA</text>

  <line x1="60" y1="772" x2="1020" y2="772" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="835" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Numa fábrica de embalagens de papelão</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">no Norte de SC, prensas e coladeiras</text>
  <text x="60" y="909" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">partindo juntas estouravam a demanda</text>
  <text x="60" y="946" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">contratada por poucos minutos.</text>

  <text x="60" y="1005" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">O BESS integrado ao FV descarrega nesse</text>
  <text x="60" y="1040" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">pico e evita a multa por ultrapassagem.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">VISITE NOSSO SITE 🔗</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
