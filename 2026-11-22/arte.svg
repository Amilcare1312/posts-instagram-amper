<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- INSTITUCIONAL tag -->
  <rect x="60" y="168" width="300" height="42" rx="6" fill="#FF7A1A"/>
  <text x="210" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">INSTITUCIONAL</text>

  <!-- Illustration: technical dossier unlocking bank financing -->
  <g transform="translate(90,250)">
    <rect x="0" y="0" width="900" height="330" rx="10" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>

    <!-- Document stack with ART seal -->
    <g transform="translate(110,55)">
      <rect x="10" y="20" width="160" height="200" rx="10" fill="#16456E" stroke="#5A7591" stroke-width="2"/>
      <rect x="0" y="10" width="160" height="200" rx="10" fill="#1C5A8C" stroke="#5A7591" stroke-width="2"/>
      <line x1="25" y1="55" x2="135" y2="55" stroke="#C9D6E3" stroke-width="5"/>
      <line x1="25" y1="80" x2="135" y2="80" stroke="#C9D6E3" stroke-width="5"/>
      <line x1="25" y1="105" x2="105" y2="105" stroke="#C9D6E3" stroke-width="5"/>
      <circle cx="120" cy="165" r="38" fill="#FF7A1A"/>
      <path d="M 102 165 L 115 178 L 140 150" fill="none" stroke="#0A2540" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="245" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#C9D6E3" text-anchor="middle">MEMORIAL + ART</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(360,150)">
      <line x1="0" y1="0" x2="130" y2="0" stroke="#FF7A1A" stroke-width="8" stroke-linecap="round"/>
      <path d="M 110 -18 L 150 0 L 110 18 Z" fill="#FF7A1A"/>
    </g>

    <!-- Bank building -->
    <g transform="translate(560,40)">
      <rect x="0" y="60" width="220" height="180" fill="#16456E" stroke="#5A7591" stroke-width="2"/>
      <path d="M -15 60 L 110 0 L 235 60 Z" fill="#1C5A8C" stroke="#5A7591" stroke-width="2"/>
      <rect x="25" y="95" width="26" height="130" fill="#0A2540"/>
      <rect x="67" y="95" width="26" height="130" fill="#0A2540"/>
      <rect x="109" y="95" width="26" height="130" fill="#0A2540"/>
      <rect x="151" y="95" width="26" height="130" fill="#0A2540"/>
      <rect x="-10" y="225" width="240" height="18" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>
      <text x="110" y="280" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#C9D6E3" text-anchor="middle">FINANCIAMENTO</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">A DOCUMENTAÇÃO</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">TÉCNICA QUE PODE</text>
  <text x="60" y="815" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="62" fill="#FF7A1A">DESTRAVAR SEU CRÉDITO</text>

  <line x1="60" y1="855" x2="1020" y2="855" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="905" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Banco não libera financiamento</text>
  <text x="60" y="940" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">de FV/BESS só com proposta.</text>
  <text x="60" y="975" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Memorial técnico e ART já</text>
  <text x="60" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">prontos aceleram a análise.</text>

  <text x="60" y="1060" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Ilustrativo. Prazos de 36-84 meses</text>
  <text x="60" y="1091" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">variam por linha de crédito e instituição.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#0A2540">COMENTA AQUI 💬</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
