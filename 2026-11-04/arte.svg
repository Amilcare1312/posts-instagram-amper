<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: inverter near UPS/no-break, with/without protection coordination -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">FV NOVO PRÓXIMO A CARGA SENSÍVEL (NO-BREAK)</text>

    <!-- divider -->
    <line x1="480" y1="65" x2="480" y2="295" stroke="#3E6890" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- LEFT: sem coordenação -->
    <g transform="translate(60,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">SEM ESTUDO DE COORDENAÇÃO</text>

      <!-- inverter icon -->
      <rect x="0" y="20" width="80" height="60" rx="8" fill="#0A2540" stroke="#C9507A" stroke-width="3"/>
      <text x="40" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C9507A" text-anchor="middle">INVERSOR</text>

      <!-- transient zigzag arrow -->
      <polyline points="90,50 120,30 140,60 170,25 195,55" fill="none" stroke="#C9507A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- UPS/no-break box -->
      <rect x="205" y="20" width="135" height="60" rx="8" fill="#0A2540" stroke="#C9507A" stroke-width="3"/>
      <text x="272" y="45" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C9507A" text-anchor="middle">NO-BREAK</text>
      <text x="272" y="65" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C9507A" text-anchor="middle">(CARGA SENSÍVEL)</text>

      <text x="0" y="135" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">⚠ risco de transitório /</text>
      <text x="0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">disparo sem motivo aparente</text>
    </g>

    <!-- RIGHT: diagnóstico Amper -->
    <g transform="translate(560,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">DIAGNÓSTICO AMPER</text>

      <!-- inverter icon -->
      <rect x="0" y="20" width="80" height="60" rx="8" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
      <text x="40" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FF7A1A" text-anchor="middle">INVERSOR</text>

      <!-- stable coordinated line -->
      <line x1="90" y1="50" x2="195" y2="50" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="142" cy="50" r="10" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
      <text x="142" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FF7A1A" text-anchor="middle">✓</text>

      <!-- UPS/no-break box -->
      <rect x="205" y="20" width="135" height="60" rx="8" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
      <text x="272" y="45" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FF7A1A" text-anchor="middle">NO-BREAK</text>
      <text x="272" y="65" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FF7A1A" text-anchor="middle">(CARGA SENSÍVEL)</text>

      <text x="0" y="135" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">✓ proteção ajustada,</text>
      <text x="0" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">sem interferência na linha</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="610" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">SOLAR PERTO DO</text>
  <text x="60" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">NO-BREAK EXIGE</text>
  <text x="60" y="734" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">COORDENAÇÃO</text>

  <line x1="60" y1="772" x2="1020" y2="772" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="835" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Numa indústria eletrônica de</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Joinville/SC, o inversor solar</text>
  <text x="60" y="909" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">quase interferiu nos no-breaks</text>
  <text x="60" y="946" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">que protegiam a linha sensível.</text>

  <text x="60" y="1005" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">Com ajuste de proteção coordenado,</text>
  <text x="60" y="1040" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">zero interferência na carga crítica.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1258" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#0A2540">FALE NO WHATSAPP 💬</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
