<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: cost per kWh comparison, solar vs grid -->
  <g transform="translate(90,190)">
    <!-- axis -->
    <line x1="0" y1="330" x2="420" y2="330" stroke="#3E6890" stroke-width="3"/>

    <!-- bars: Solar LCOE (low, orange) vs Rede tariff (high, blue) -->
    <rect x="60"  y="230" width="130" height="100" fill="#FF7A1A"/>
    <rect x="260" y="33"  width="130" height="297" fill="#4C7AA6"/>

    <text x="125" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C9D6E3" text-anchor="middle">SOLAR</text>
    <text x="325" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C9D6E3" text-anchor="middle">REDE</text>

    <text x="125" y="216" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="26" fill="#FFFFFF" text-anchor="middle">R$0,25-0,40</text>
    <text x="325" y="19"  font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="26" fill="#FFFFFF" text-anchor="middle">R$0,75-0,95</text>

    <!-- sun icon above solar bar -->
    <g transform="translate(125,-30)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#FF7A1A" stroke-width="4"/>
      <g stroke="#FF7A1A" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-44"/>
        <line x1="0" y1="34" x2="0" y2="44"/>
        <line x1="-34" y1="0" x2="-44" y2="0"/>
        <line x1="34" y1="0" x2="44" y2="0"/>
        <line x1="-24" y1="-24" x2="-31" y2="-31"/>
        <line x1="24" y1="24" x2="31" y2="31"/>
        <line x1="-24" y1="24" x2="-31" y2="31"/>
        <line x1="24" y1="-24" x2="31" y2="-31"/>
      </g>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#FFFFFF">SEU kWh SOLAR</text>
  <text x="60" y="775" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="66" fill="#FF7A1A">CUSTA ATÉ 3X MENOS</text>
  <text x="60" y="828" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">QUE O kWh DA REDE*</text>

  <line x1="60" y1="866" x2="1020" y2="866" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="925" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">Custo nivelado (LCOE) da</text>
  <text x="60" y="962" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">geração própria vs. tarifa média</text>
  <text x="60" y="999" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">Grupo A/CELESC-D em média tensão.</text>

  <text x="60" y="1055" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Estimativa ilustrativa (R$/kWh). O número real</text>
  <text x="60" y="1088" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">depende do estudo de viabilidade.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">SALVA ESSE POST</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
