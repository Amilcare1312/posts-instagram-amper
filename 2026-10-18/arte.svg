<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- INSTITUCIONAL tag -->
  <rect x="60" y="168" width="300" height="42" rx="6" fill="#FF7A1A"/>
  <text x="210" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">INSTITUCIONAL</text>

  <!-- Illustration: magnifying glass (diagnostico) over a row of distinct industry icons -->
  <g transform="translate(90,245)">
    <!-- ground line -->
    <line x1="0" y1="330" x2="900" y2="330" stroke="#3E6890" stroke-width="3"/>

    <!-- Icon 1: Factory (metalurgia/fundicao) -->
    <g transform="translate(20,200)">
      <rect x="0" y="40" width="110" height="90" fill="#5A7591" stroke="#C9D6E3" stroke-width="2"/>
      <polygon points="0,40 35,10 70,40" fill="#5A7591" stroke="#C9D6E3" stroke-width="2"/>
      <rect x="18" y="0" width="14" height="30" fill="#5A7591" stroke="#C9D6E3" stroke-width="2"/>
      <rect x="25" y="65" width="22" height="22" fill="#0F2E4E"/>
      <rect x="63" y="65" width="22" height="22" fill="#0F2E4E"/>
    </g>

    <!-- Icon 2: Snowflake (camara fria / laticinios / frigorifico) -->
    <g transform="translate(200,235)" stroke="#C9D6E3" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-45" x2="0" y2="45"/>
      <line x1="-39" y1="-22" x2="39" y2="22"/>
      <line x1="-39" y1="22" x2="39" y2="-22"/>
      <line x1="0" y1="-45" x2="-14" y2="-30"/>
      <line x1="0" y1="-45" x2="14" y2="-30"/>
      <line x1="0" y1="45" x2="-14" y2="30"/>
      <line x1="0" y1="45" x2="14" y2="30"/>
    </g>

    <!-- Icon 3: Flask (quimico/tintas/curtume) -->
    <g transform="translate(355,195)">
      <rect x="20" y="0" width="20" height="40" fill="#5A7591" stroke="#C9D6E3" stroke-width="2"/>
      <path d="M 18 38 L 5 110 Q 2 135 30 135 Q 58 135 55 110 L 42 38 Z" fill="#0F2E4E" stroke="#C9D6E3" stroke-width="2"/>
      <path d="M 10 95 Q 30 85 50 95 L 55 110 Q 58 135 30 135 Q 2 135 5 110 Z" fill="#FF7A1A" opacity="0.8"/>
    </g>

    <!-- Icon 4: Gear (metalurgia/plasticos/equipamentos industriais) -->
    <g transform="translate(500,195)" fill="#5A7591" stroke="#C9D6E3" stroke-width="2">
      <circle cx="40" cy="40" r="26"/>
      <circle cx="40" cy="40" r="11" fill="#0F2E4E" stroke="none"/>
      <g>
        <rect x="33" y="-6" width="14" height="18"/>
        <rect x="33" y="68" width="14" height="18"/>
        <rect x="-6" y="33" width="18" height="14"/>
        <rect x="68" y="33" width="18" height="14"/>
        <rect x="33" y="-6" width="14" height="18" transform="rotate(45 40 40)"/>
        <rect x="33" y="68" width="14" height="18" transform="rotate(45 40 40)"/>
        <rect x="-6" y="33" width="18" height="14" transform="rotate(45 40 40)"/>
        <rect x="68" y="33" width="18" height="14" transform="rotate(45 40 40)"/>
      </g>
    </g>

    <!-- Icon 5: Droplet (textil/corantes/bebidas) -->
    <g transform="translate(655,190)">
      <path d="M 35 0 C 55 35 70 60 70 85 C 70 115 50 135 35 135 C 20 135 0 115 0 85 C 0 60 15 35 35 0 Z" fill="#5A7591" stroke="#C9D6E3" stroke-width="2"/>
      <ellipse cx="25" cy="90" rx="10" ry="16" fill="#0F2E4E"/>
    </g>

    <!-- Icon 6: Textile/weave swatch -->
    <g transform="translate(800,200)" stroke="#C9D6E3" stroke-width="3">
      <rect x="0" y="0" width="90" height="90" rx="6" fill="#5A7591"/>
      <line x1="0" y1="22" x2="90" y2="22"/>
      <line x1="0" y1="45" x2="90" y2="45"/>
      <line x1="0" y1="67" x2="90" y2="67"/>
      <line x1="22" y1="0" x2="22" y2="90"/>
      <line x1="45" y1="0" x2="45" y2="90"/>
      <line x1="67" y1="0" x2="67" y2="90"/>
    </g>

    <!-- Magnifying glass overlay (diagnostico tecnico) connecting all segments -->
    <g transform="translate(395,40)">
      <circle cx="90" cy="90" r="85" fill="none" stroke="#FF7A1A" stroke-width="9"/>
      <line x1="150" y1="150" x2="210" y2="210" stroke="#FF7A1A" stroke-width="16" stroke-linecap="round"/>
      <circle cx="90" cy="90" r="85" fill="#0A2540" opacity="0.08"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF">CADA FÁBRICA,</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF">UMA ENGENHARIA</text>
  <text x="60" y="815" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="70" fill="#FF7A1A">DIFERENTE</text>

  <line x1="60" y1="855" x2="1020" y2="855" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="905" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Já diagnosticamos mais de 10</text>
  <text x="60" y="940" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">segmentos industriais distintos</text>
  <text x="60" y="975" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">em SC — cada um com sua</text>
  <text x="60" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">particularidade técnica própria.</text>

  <text x="60" y="1060" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Mais de 10 segmentos diagnosticados</text>
  <text x="60" y="1091" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">pela Amper em SC (estimativa ilustrativa,</text>
  <text x="60" y="1122" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">com base no histórico de projetos).</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">COMENTA AQUI 💬</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
