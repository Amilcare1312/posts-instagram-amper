<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: technical report clipboard with checkmark seal and magnifier -->
  <g transform="translate(60,180)">
    <!-- clipboard body -->
    <rect x="0" y="20" width="330" height="420" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>
    <rect x="115" y="0" width="100" height="34" rx="10" fill="#3E6890"/>

    <!-- document lines -->
    <rect x="34" y="80" width="262" height="14" rx="6" fill="#C9D6E3"/>
    <rect x="34" y="112" width="262" height="14" rx="6" fill="#3E6890"/>
    <rect x="34" y="144" width="190" height="14" rx="6" fill="#3E6890"/>

    <!-- mini bar chart representing calculations -->
    <rect x="34" y="200" width="26" height="70" fill="#FF7A1A"/>
    <rect x="72" y="175" width="26" height="95" fill="#FF7A1A"/>
    <rect x="110" y="220" width="26" height="50" fill="#FF7A1A"/>
    <rect x="148" y="190" width="26" height="80" fill="#FF7A1A"/>
    <rect x="186" y="160" width="26" height="110" fill="#FF7A1A"/>
    <line x1="34" y1="272" x2="296" y2="272" stroke="#C9D6E3" stroke-width="3"/>

    <rect x="34" y="300" width="262" height="14" rx="6" fill="#3E6890"/>
    <rect x="34" y="332" width="150" height="14" rx="6" fill="#3E6890"/>

    <!-- checkmark seal -->
    <circle cx="260" cy="370" r="46" fill="#FF7A1A"/>
    <path d="M240 370 L254 386 L282 352" stroke="#0A2540" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- magnifier over the clipboard -->
  <g transform="translate(330,150)">
    <circle cx="60" cy="60" r="52" fill="none" stroke="#FF7A1A" stroke-width="12"/>
    <line x1="98" y1="98" x2="150" y2="150" stroke="#FF7A1A" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#FFFFFF">MEMORIAL TÉCNICO</text>
  <text x="60" y="762" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#FFFFFF">COMPLETO, NÃO SÓ</text>
  <text x="60" y="824" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#FF7A1A">UMA PROMESSA</text>

  <line x1="60" y1="862" x2="1020" y2="862" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="925" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Curva de carga, dimensionamento e retorno</text>
  <text x="60" y="962" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">financeiro: cada número da proposta vem</text>
  <text x="60" y="999" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">com a conta técnica por trás dele.</text>

  <text x="60" y="1055" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">Especialmente importante para Grupo A / CELESC-D,</text>
  <text x="60" y="1090" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">onde demanda contratada e posto tarifário entram na conta.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">VISITE NOSSO SITE 🔗</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
