<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: contrato sem PR garantido x contrato com PR garantido -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">GARANTIA DE PERFORMANCE (PR) NO CONTRATO</text>

    <!-- divider -->
    <line x1="480" y1="65" x2="480" y2="295" stroke="#3E6890" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- LEFT: sem garantia de PR -->
    <g transform="translate(60,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">SEM PR GARANTIDO</text>

      <!-- contract icon -->
      <rect x="20" y="20" width="90" height="110" rx="6" fill="#0A2540" stroke="#C9507A" stroke-width="3"/>
      <line x1="35" y1="45" x2="95" y2="45" stroke="#C9507A" stroke-width="3"/>
      <line x1="35" y1="65" x2="95" y2="65" stroke="#C9507A" stroke-width="3"/>
      <line x1="35" y1="85" x2="70" y2="85" stroke="#C9507A" stroke-width="3"/>

      <!-- question mark gauge -->
      <circle cx="195" cy="75" r="45" fill="none" stroke="#C9507A" stroke-width="6"/>
      <text x="195" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#C9507A" text-anchor="middle">?</text>

      <text x="0" y="165" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">⚠ payback sem</text>
      <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">mecanismo de proteção</text>
    </g>

    <!-- RIGHT: com garantia de PR -->
    <g transform="translate(560,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">COM PR GARANTIDO</text>

      <!-- contract icon with check -->
      <rect x="20" y="20" width="90" height="110" rx="6" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
      <line x1="35" y1="45" x2="95" y2="45" stroke="#FF7A1A" stroke-width="3"/>
      <line x1="35" y1="65" x2="95" y2="65" stroke="#FF7A1A" stroke-width="3"/>
      <line x1="35" y1="85" x2="70" y2="85" stroke="#FF7A1A" stroke-width="3"/>

      <!-- gauge at ~80% -->
      <circle cx="195" cy="75" r="45" fill="none" stroke="#3E6890" stroke-width="6"/>
      <path d="M 195 30 A 45 45 0 1 1 158 108" fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round"/>
      <text x="195" y="82" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="26" fill="#FF7A1A" text-anchor="middle">PR</text>

      <text x="0" y="165" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">✓ retorno com</text>
      <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">métrica contratual clara</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="610" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">SEU CONTRATO</text>
  <text x="60" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">GARANTE PR</text>
  <text x="60" y="734" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">OU SÓ POTÊNCIA?</text>

  <line x1="60" y1="772" x2="1020" y2="772" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="835" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Potência instalada não é</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">garantia de geração real.</text>
  <text x="60" y="909" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">O indicador que protege seu</text>
  <text x="60" y="946" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">payback é o PR contratual.</text>

  <text x="60" y="1005" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">PR estimado típico: 75% a 85%*</text>
  <text x="60" y="1040" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">*faixa ilustrativa, varia por projeto</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1258" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#0A2540">COMENTA AQUI 💬</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
