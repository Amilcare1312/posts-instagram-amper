<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: progress report card with timeline -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">RELATÓRIO DE PROGRESSO · OBRA EM ANDAMENTO</text>

    <!-- timeline -->
    <line x1="60" y1="110" x2="900" y2="110" stroke="#3E6890" stroke-width="4"/>

    <circle cx="100" cy="110" r="14" fill="#FF7A1A"/>
    <text x="100" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle">Montagem</text>

    <circle cx="340" cy="110" r="14" fill="#FF7A1A"/>
    <text x="340" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle">Cabeamento</text>

    <circle cx="580" cy="110" r="14" fill="#4C9EF5"/>
    <text x="580" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#C9D6E3" text-anchor="middle">Comissionamento</text>

    <circle cx="860" cy="110" r="14" fill="#2E4E6E" stroke="#4C9EF5" stroke-width="3"/>
    <text x="860" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#C9D6E3" text-anchor="middle">Homologação</text>

    <!-- camera/photo icon representing field photo update -->
    <g transform="translate(60,195)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
      <circle cx="40" cy="30" r="16" fill="none" stroke="#FF7A1A" stroke-width="3"/>
      <rect x="25" y="-8" width="30" height="14" rx="3" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
    </g>
    <text x="160" y="225" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">Fotos + status atualizado</text>
    <text x="160" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">a cada 7-10 dias direto ao cliente</text>
  </g>

  <!-- Headline -->
  <text x="60" y="610" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">SUA OBRA SOLAR</text>
  <text x="60" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">NÃO É UMA</text>
  <text x="60" y="734" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">CAIXA-PRETA.</text>

  <line x1="60" y1="772" x2="1020" y2="772" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="835" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Relatório periódico com fotos,</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">cronograma e pendências —</text>
  <text x="60" y="909" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">direto da equipe para você.</text>

  <text x="60" y="968" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">Isso também entra no as-built final —</text>
  <text x="60" y="1003" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">junto com ART e memorial técnico.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#0A2540">DIAGNÓSTICO GRATUITO 👉</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
