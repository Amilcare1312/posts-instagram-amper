<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: Fio B non-compensable share rising 2026 -> 2027 -->
  <g transform="translate(90,190)">
    <!-- axis -->
    <line x1="0" y1="330" x2="420" y2="330" stroke="#3E6890" stroke-width="3"/>

    <!-- bars: 2026 (60%) vs 2027 (75%) -->
    <rect x="60"  y="198" width="130" height="132" fill="#4C7AA6"/>
    <rect x="260" y="33"  width="130" height="297" fill="#FF7A1A"/>

    <text x="125" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C9D6E3" text-anchor="middle">2026</text>
    <text x="325" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C9D6E3" text-anchor="middle">2027</text>

    <text x="125" y="184" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#FFFFFF" text-anchor="middle">60%</text>
    <text x="325" y="19"  font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#FFFFFF" text-anchor="middle">75%</text>

    <!-- arrow showing the jump -->
    <g stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M195,185 C230,120 250,80 255,50"/>
      <path d="M255,50 l-14,10 M255,50 l6,-16" />
    </g>

    <!-- clock icon above chart -->
    <g transform="translate(395,-30)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#FF7A1A" stroke-width="4"/>
      <line x1="0" y1="0" x2="0" y2="-14" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="10" y2="4" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#FFFFFF">ADIAR 1 ANO</text>
  <text x="60" y="775" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="66" fill="#FF7A1A">CUSTA MAIS CARO</text>
  <text x="60" y="828" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF">NO FIO B NÃO COMPENSÁVEL*</text>

  <line x1="60" y1="866" x2="1020" y2="866" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="925" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">Cada ano que passa sem FV,</text>
  <text x="60" y="962" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">seu excedente solar futuro</text>
  <text x="60" y="999" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">compensa menos na fatura.</text>

  <text x="60" y="1055" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Cronograma oficial REN ANEEL 1000/2021.</text>
  <text x="60" y="1088" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">Impacto real depende de estudo de viabilidade.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">CHAMA NO WHATSAPP</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
