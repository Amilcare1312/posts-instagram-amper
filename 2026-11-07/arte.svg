<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- SUSTENTABILIDADE tag -->
  <rect x="60" y="168" width="330" height="42" rx="6" fill="#FF7A1A"/>
  <text x="225" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">SUSTENTABILIDADE</text>

  <!-- Illustration: warehouse with PV roof shading, hot side vs cool side -->
  <g transform="translate(60,250)">
    <!-- sun -->
    <circle cx="880" cy="0" r="24" fill="#FF7A1A"/>
    <line x1="880" y1="-40" x2="880" y2="-54" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="910" y1="-16" x2="922" y2="-26" stroke="#FF7A1A" stroke-width="4"/>
    <line x1="850" y1="-16" x2="838" y2="-26" stroke="#FF7A1A" stroke-width="4"/>

    <!-- ground line -->
    <line x1="0" y1="340" x2="940" y2="340" stroke="#3E6890" stroke-width="3"/>

    <!-- LEFT warehouse: bare metal roof, exposed to sun, hot -->
    <g transform="translate(20,120)">
      <rect x="0" y="80" width="300" height="140" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>
      <path d="M 0 80 L 150 20 L 300 80 Z" fill="#8A95A3"/>
      <!-- heat wavy lines rising from roof -->
      <path d="M 60 10 Q 70 -10 60 -30 Q 50 -50 60 -70" stroke="#FF7A1A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M 120 5 Q 130 -15 120 -35 Q 110 -55 120 -75" stroke="#FF7A1A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M 190 5 Q 200 -15 190 -35 Q 180 -55 190 -75" stroke="#FF7A1A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
      <!-- door -->
      <rect x="120" y="150" width="60" height="70" fill="#0A2540" stroke="#5A7591" stroke-width="2"/>
      <!-- thermometer high -->
      <g transform="translate(330,70)">
        <rect x="0" y="0" width="16" height="70" rx="8" fill="#1A3E63" stroke="#FF7A1A" stroke-width="2"/>
        <circle cx="8" cy="78" r="14" fill="#FF7A1A"/>
        <rect x="3" y="15" width="10" height="63" rx="5" fill="#FF7A1A"/>
      </g>
      <text x="150" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#C9D6E3">TELHADO EXPOSTO</text>
    </g>

    <!-- RIGHT warehouse: PV panels shading the roof, cooler -->
    <g transform="translate(560,120)">
      <rect x="0" y="80" width="300" height="140" fill="#0F2E4E" stroke="#5A7591" stroke-width="2"/>
      <path d="M 0 80 L 150 20 L 300 80 Z" fill="#8A95A3"/>
      <!-- panel array elevated above roof slope -->
      <g transform="translate(20,-18)">
        <line x1="10" y1="40" x2="0" y2="70" stroke="#C9D6E3" stroke-width="5"/>
        <line x1="250" y1="40" x2="260" y2="70" stroke="#C9D6E3" stroke-width="5"/>
        <rect x="0" y="0" width="260" height="46" rx="4" fill="#0A2540" stroke="#FF7A1A" stroke-width="2" transform="rotate(-6 130 23)"/>
        <line x1="10" y1="16" x2="245" y2="6" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 130 23)"/>
        <line x1="10" y1="34" x2="245" y2="24" stroke="#5A7591" stroke-width="1.5" transform="rotate(-6 130 23)"/>
      </g>
      <!-- shadow cast under panels -->
      <rect x="15" y="60" width="270" height="22" fill="#061B30" opacity="0.6"/>
      <!-- door -->
      <rect x="120" y="150" width="60" height="70" fill="#0A2540" stroke="#5A7591" stroke-width="2"/>
      <!-- thermometer low -->
      <g transform="translate(330,100)">
        <rect x="0" y="0" width="16" height="40" rx="8" fill="#1A3E63" stroke="#2E9E6B" stroke-width="2"/>
        <circle cx="8" cy="48" r="14" fill="#2E9E6B"/>
        <rect x="3" y="25" width="10" height="23" rx="5" fill="#2E9E6B"/>
      </g>
      <text x="150" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#C9D6E3">TELHADO SOMBREADO</text>
    </g>

    <!-- arrow between the two -->
    <path d="M 335 280 L 555 280" stroke="#FF7A1A" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 Z" fill="#FF7A1A"/>
      </marker>
    </defs>
  </g>

  <!-- Headline -->
  <text x="60" y="705" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">PAINEL SOLAR</text>
  <text x="60" y="753" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#FFFFFF">TAMBÉM ESFRIA</text>
  <text x="60" y="830" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="70" fill="#FF7A1A">SEU GALPÃO</text>

  <line x1="60" y1="868" x2="1020" y2="868" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="918" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Painéis sobre o telhado metálico</text>
  <text x="60" y="953" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">sombreiam a cobertura e reduzem</text>
  <text x="60" y="988" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">a carga térmica — menos calor</text>
  <text x="60" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">dentro, menos exaustão ligada.</text>

  <text x="60" y="1073" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Efeito varia com tipo de cobertura,</text>
  <text x="60" y="1104" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">pé-direito e ventilação — estimativa</text>
  <text x="60" y="1135" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">ilustrativa, cada galpão é avaliado.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">CHAMA NO WHATSAPP 💬</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
