<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- BASTIDORES tag -->
  <rect x="60" y="168" width="190" height="42" rx="6" fill="#FF7A1A"/>
  <text x="155" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">BASTIDORES</text>

  <!-- Illustration: crate with PV module + inspection clipboard + magnifier -->
  <g transform="translate(90,240)">
    <!-- ground line -->
    <line x1="0" y1="300" x2="440" y2="300" stroke="#3E6890" stroke-width="3"/>

    <!-- crate box -->
    <rect x="20" y="150" width="230" height="150" fill="#12395F" stroke="#C9D6E3" stroke-width="2"/>
    <line x1="20" y1="150" x2="250" y2="300" stroke="#3E6890" stroke-width="2"/>
    <line x1="250" y1="150" x2="20" y2="300" stroke="#3E6890" stroke-width="2"/>
    <rect x="20" y="150" width="230" height="30" fill="#0F2E4E" stroke="#C9D6E3" stroke-width="2"/>

    <!-- PV module peeking out of crate -->
    <g transform="translate(45,70)">
      <rect x="0" y="0" width="180" height="110" rx="4" fill="#0F2E4E" stroke="#FF7A1A" stroke-width="3"/>
      <line x1="45" y1="0" x2="45" y2="110" stroke="#3E6890" stroke-width="2"/>
      <line x1="90" y1="0" x2="90" y2="110" stroke="#3E6890" stroke-width="2"/>
      <line x1="135" y1="0" x2="135" y2="110" stroke="#3E6890" stroke-width="2"/>
      <line x1="0" y1="55" x2="180" y2="55" stroke="#3E6890" stroke-width="2"/>
    </g>

    <!-- clipboard with checklist -->
    <g transform="translate(290,90)">
      <rect x="0" y="0" width="140" height="190" rx="8" fill="#FFFFFF"/>
      <rect x="40" y="-10" width="60" height="20" rx="4" fill="#C9D6E3"/>
      <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0A2540">
        <circle cx="22" cy="40" r="8" fill="#FF7A1A"/>
        <text x="22" y="46" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-size="12">✓</text>
        <line x1="42" y1="40" x2="115" y2="40" stroke="#0A2540" stroke-width="3"/>

        <circle cx="22" cy="80" r="8" fill="#FF7A1A"/>
        <text x="22" y="86" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-size="12">✓</text>
        <line x1="42" y1="80" x2="115" y2="80" stroke="#0A2540" stroke-width="3"/>

        <circle cx="22" cy="120" r="8" fill="#FF7A1A"/>
        <text x="22" y="126" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-size="12">✓</text>
        <line x1="42" y1="120" x2="115" y2="120" stroke="#0A2540" stroke-width="3"/>

        <circle cx="22" cy="160" r="8" fill="none" stroke="#0A2540" stroke-width="3"/>
        <line x1="42" y1="160" x2="115" y2="160" stroke="#0A2540" stroke-width="3"/>
      </g>
    </g>

    <!-- magnifying glass over serial number -->
    <g transform="translate(160,170)">
      <circle cx="0" cy="0" r="46" fill="#0A2540" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="5"/>
      <line x1="32" y1="32" x2="60" y2="60" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">S/N</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF">NENHUM EQUIPAMENTO</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF">SOBE NO TELHADO SEM</text>
  <text x="60" y="815" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="70" fill="#FF7A1A">INSPEÇÃO</text>

  <line x1="60" y1="855" x2="1020" y2="855" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="905" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">Número de série, certificação INMETRO</text>
  <text x="60" y="940" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">e inspeção visual de avarias — tudo</text>
  <text x="60" y="975" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">checado antes do 1º parafuso.</text>

  <text x="60" y="1030" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Estimativa ilustrativa: 1-3% dos lotes</text>
  <text x="60" y="1061" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">recebidos apresentam alguma não</text>
  <text x="60" y="1092" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">conformidade identificável nesta etapa.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">VISITE NOSSO SITE 🔗</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
