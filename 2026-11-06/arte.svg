<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: engenheiro 1 projeta x engenheiro 2 revisa -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">REVISÃO CRUZADA DE PROJETO</text>

    <!-- divider -->
    <line x1="480" y1="65" x2="480" y2="295" stroke="#3E6890" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- LEFT: engenheiro que projeta -->
    <g transform="translate(60,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9D6E3">ENGENHEIRO 1 · PROJETA</text>

      <!-- blueprint/document icon -->
      <rect x="20" y="20" width="90" height="110" rx="6" fill="#0A2540" stroke="#3E6890" stroke-width="3"/>
      <line x1="35" y1="45" x2="95" y2="45" stroke="#3E6890" stroke-width="3"/>
      <line x1="35" y1="65" x2="95" y2="65" stroke="#3E6890" stroke-width="3"/>
      <line x1="35" y1="85" x2="70" y2="85" stroke="#3E6890" stroke-width="3"/>
      <!-- pencil -->
      <line x1="100" y1="115" x2="135" y2="80" stroke="#FF7A1A" stroke-width="7" stroke-linecap="round"/>
      <polygon points="133,78 141,70 148,77 140,85" fill="#FF7A1A"/>

      <!-- ruler/triangle -->
      <circle cx="195" cy="75" r="45" fill="none" stroke="#3E6890" stroke-width="6"/>
      <text x="195" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#C9D6E3" text-anchor="middle">1</text>

      <text x="0" y="165" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9D6E3">memorial, string,</text>
      <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9D6E3">proteção calculados</text>
    </g>

    <!-- RIGHT: segundo engenheiro revisa -->
    <g transform="translate(560,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">ENGENHEIRO 2 · REVISA</text>

      <!-- document with check -->
      <rect x="20" y="20" width="90" height="110" rx="6" fill="#0A2540" stroke="#FF7A1A" stroke-width="3"/>
      <line x1="35" y1="45" x2="95" y2="45" stroke="#FF7A1A" stroke-width="3"/>
      <line x1="35" y1="65" x2="95" y2="65" stroke="#FF7A1A" stroke-width="3"/>
      <line x1="35" y1="85" x2="70" y2="85" stroke="#FF7A1A" stroke-width="3"/>

      <!-- magnifying glass with check -->
      <circle cx="195" cy="68" r="34" fill="none" stroke="#FF7A1A" stroke-width="6"/>
      <line x1="218" y1="92" x2="240" y2="114" stroke="#FF7A1A" stroke-width="7" stroke-linecap="round"/>
      <path d="M 180 68 L 192 80 L 214 55" fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="0" y="165" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">✓ projeto validado</text>
      <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">antes da obra</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="610" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">SEU PROJETO SOLAR</text>
  <text x="60" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">PASSA POR OUTRO</text>
  <text x="60" y="734" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">ENGENHEIRO ANTES?</text>

  <line x1="60" y1="772" x2="1020" y2="772" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="835" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Na Amper, nenhum projeto</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">vai para a obra sem passar</text>
  <text x="60" y="909" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">por revisão de um segundo</text>
  <text x="60" y="946" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">engenheiro técnico.</text>

  <text x="60" y="1005" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">Menos ajuste de última hora,</text>
  <text x="60" y="1040" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">mais projeto validado em campo.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1258" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#0A2540">SALVA ESSE POST 📌</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
