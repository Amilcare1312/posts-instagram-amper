<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- CASO DE SUCESSO tag -->
  <rect x="60" y="168" width="300" height="42" rx="6" fill="#FF7A1A"/>
  <text x="210" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#0A2540" text-anchor="middle">CASO DE SUCESSO</text>

  <!-- Illustration: sun generation curve synced with EVSE charging window -->
  <g transform="translate(60,235)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">GERAÇÃO FV x RECARGA DAS EMPILHADEIRAS</text>

    <!-- sun icon -->
    <g transform="translate(130,170)">
      <circle cx="0" cy="0" r="38" fill="#FF7A1A"/>
      <g stroke="#FF7A1A" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-58" x2="0" y2="-72"/>
        <line x1="0" y1="58" x2="0" y2="72"/>
        <line x1="-58" y1="0" x2="-72" y2="0"/>
        <line x1="58" y1="0" x2="72" y2="0"/>
        <line x1="-41" y1="-41" x2="-51" y2="-51"/>
        <line x1="41" y1="41" x2="51" y2="51"/>
        <line x1="-41" y1="41" x2="-51" y2="51"/>
        <line x1="41" y1="-41" x2="51" y2="-51"/>
      </g>
    </g>

    <!-- generation curve (bell) -->
    <path d="M60 260 C 200 260, 220 90, 390 90 C 460 90, 520 90, 580 90 C 700 90, 760 260, 900 260"
          fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round"/>
    <text x="620" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">geração solar</text>

    <!-- old charging window (dashed pink, outside sun hours) -->
    <rect x="60" y="230" width="90" height="30" fill="none" stroke="#C9507A" stroke-width="3" stroke-dasharray="6,6"/>
    <text x="40" y="300" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#C9507A">recarga à noite (antes)</text>

    <!-- new charging window (highlighted box, under the curve peak) -->
    <rect x="400" y="110" width="150" height="150" rx="6" fill="#1C4A73" stroke="#FF7A1A" stroke-width="3"/>
    <text x="400" y="296" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">recarga no sol (agora)</text>

    <!-- forklift / EVSE icon -->
    <g transform="translate(830,160)">
      <rect x="-45" y="10" width="90" height="55" rx="6" fill="#0A2540" stroke="#C9D6E3" stroke-width="3"/>
      <rect x="-30" y="-35" width="20" height="45" fill="#0A2540" stroke="#C9D6E3" stroke-width="3"/>
      <circle cx="-25" cy="70" r="12" fill="#C9D6E3"/>
      <circle cx="25" cy="70" r="12" fill="#C9D6E3"/>
      <path d="M0 -10 L10 5 L-10 5 Z" fill="#FF7A1A"/>
      <text x="0" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#C9D6E3">EVSE</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="660" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">A FROTA PASSOU</text>
  <text x="60" y="722" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">A CARREGAR</text>
  <text x="60" y="784" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">NO HORÁRIO DO SOL</text>

  <line x1="60" y1="822" x2="1020" y2="822" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="885" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">Numa indústria de beneficiamento de</text>
  <text x="60" y="920" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">arroz no Vale do Itajaí, as empilhadeiras</text>
  <text x="60" y="955" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">elétricas recarregavam fora do horário</text>
  <text x="60" y="990" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">de geração solar, puxando da rede.</text>

  <text x="60" y="1045" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">A Amper reprogramou a recarga pro sol:</text>
  <text x="60" y="1080" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">15-25%* menos pico de demanda fora de hora.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">SALVA ESSE POST 📌</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
