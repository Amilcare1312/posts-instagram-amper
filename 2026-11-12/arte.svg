<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- Illustration: FP fora da faixa x FP dentro da faixa -->
  <g transform="translate(60,185)">
    <rect x="0" y="0" width="960" height="330" rx="18" fill="#12395F" stroke="#3E6890" stroke-width="3"/>

    <text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D6E3">FATOR DE POTÊNCIA (FP) DA UNIDADE</text>

    <!-- divider -->
    <line x1="480" y1="65" x2="480" y2="295" stroke="#3E6890" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- LEFT: FP fora da faixa -->
    <g transform="translate(90,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">FP FORA DA FAIXA</text>

      <!-- gauge: needle low, in red zone -->
      <circle cx="135" cy="80" r="60" fill="none" stroke="#2A4A6B" stroke-width="10"/>
      <path d="M 75 80 A 60 60 0 0 1 135 20" fill="none" stroke="#C9507A" stroke-width="10"/>
      <line x1="135" y1="80" x2="95" y2="42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="135" cy="80" r="7" fill="#FFFFFF"/>
      <text x="135" y="165" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#C9507A" text-anchor="middle">0,80</text>

      <text x="0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">⚠ cobrança extra</text>
      <text x="0" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C9507A">de energia reativa</text>
    </g>

    <!-- RIGHT: FP dentro da faixa -->
    <g transform="translate(590,90)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">FP DENTRO DA FAIXA</text>

      <!-- gauge: needle near top, in orange zone -->
      <circle cx="135" cy="80" r="60" fill="none" stroke="#2A4A6B" stroke-width="10"/>
      <path d="M 75 80 A 60 60 0 0 1 185 65" fill="none" stroke="#FF7A1A" stroke-width="10"/>
      <line x1="135" y1="80" x2="178" y2="55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="135" cy="80" r="7" fill="#FFFFFF"/>
      <text x="135" y="165" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#FF7A1A" text-anchor="middle">0,95</text>

      <text x="0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">✓ ajustado no</text>
      <text x="0" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF7A1A">comissionamento do inversor</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="610" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">GERANDO 100%</text>
  <text x="60" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF">E AINDA ASSIM</text>
  <text x="60" y="734" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#FF7A1A">LEVA MULTA?</text>

  <line x1="60" y1="772" x2="1020" y2="772" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="835" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">Fator de potência fora</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">da faixa cobra reativo</text>
  <text x="60" y="909" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">mesmo com o FV cobrindo</text>
  <text x="60" y="946" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF">o consumo ativo.</text>

  <text x="60" y="1005" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">Referência usual: FP ≥ 0,92*</text>
  <text x="60" y="1040" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="24" fill="#C9D6E3">*ilustrativo, confira o CUSD da sua unidade</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1258" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#0A2540">VISITA O SITE 🔗</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
