<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- MITO VS VERDADE tag -->
  <rect x="60" y="168" width="300" height="42" rx="6" fill="#FF7A1A"/>
  <text x="210" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#0A2540" text-anchor="middle">MITO VS VERDADE</text>

  <!-- Illustration: faded stopwatch (myth: anos de espera) -> arrow -> defined timeline/checklist (truth: fluxo CELESC-D) -->
  <g transform="translate(70,245)">
    <!-- ground line -->
    <line x1="0" y1="300" x2="940" y2="300" stroke="#3E6890" stroke-width="3"/>

    <!-- Stopwatch (left, dim, crossed out) -->
    <g transform="translate(10,55)" opacity="0.65">
      <line x1="60" y1="8" x2="60" y2="30" stroke="#5A7591" stroke-width="8" stroke-linecap="round"/>
      <rect x="40" y="0" width="40" height="14" rx="4" fill="#5A7591"/>
      <circle cx="60" cy="130" r="95" fill="#0F2E4E" stroke="#5A7591" stroke-width="6"/>
      <line x1="60" y1="130" x2="60" y2="65" stroke="#C9D6E3" stroke-width="6" stroke-linecap="round"/>
      <line x1="60" y1="130" x2="105" y2="150" stroke="#C9D6E3" stroke-width="6" stroke-linecap="round"/>
      <circle cx="60" cy="130" r="6" fill="#C9D6E3"/>
      <!-- cross out -->
      <line x1="-25" y1="15" x2="150" y2="245" stroke="#C9D6E3" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
      <text x="60" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">MEDO: "ANOS</text>
      <text x="60" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#C9D6E3">DE ESPERA"</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(205,160)">
      <line x1="0" y1="0" x2="55" y2="0" stroke="#FF7A1A" stroke-width="5"/>
      <polygon points="55,-10 75,0 55,10" fill="#FF7A1A"/>
    </g>

    <!-- Timeline / checklist (right): 4 milestones toward checkmark -->
    <g transform="translate(320,10)">
      <rect x="0" y="35" width="600" height="220" rx="8" fill="#FFFFFF"/>
      <rect x="22" y="15" width="200" height="16" rx="4" fill="#C9D6E3"/>

      <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0A2540">
        <circle cx="40" cy="78" r="9" fill="none" stroke="#2E7D4F" stroke-width="3"/>
        <path d="M 35 78 L 39 82 L 46 73" stroke="#2E7D4F" stroke-width="2.5" fill="none"/>
        <text x="60" y="84">1. Protocolo do projeto</text>

        <circle cx="40" cy="118" r="9" fill="none" stroke="#2E7D4F" stroke-width="3"/>
        <path d="M 35 118 L 39 122 L 46 113" stroke="#2E7D4F" stroke-width="2.5" fill="none"/>
        <text x="60" y="124">2. Parecer de acesso</text>

        <circle cx="40" cy="158" r="9" fill="none" stroke="#2E7D4F" stroke-width="3"/>
        <path d="M 35 158 L 39 162 L 46 153" stroke="#2E7D4F" stroke-width="2.5" fill="none"/>
        <text x="60" y="164">3. Vistoria técnica</text>

        <circle cx="40" cy="198" r="9" fill="none" stroke="#FF7A1A" stroke-width="3"/>
        <path d="M 35 198 L 39 202 L 46 193" stroke="#FF7A1A" stroke-width="2.5" fill="none"/>
        <text x="60" y="204" fill="#FF7A1A" font-weight="bold">4. Troca do medidor</text>
      </g>

      <circle cx="540" cy="195" r="46" fill="#FF7A1A"/>
      <path d="M 516 195 L 534 213 L 566 177" stroke="#0A2540" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="320" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" fill="#C9D6E3">FLUXO TÉCNICO DEFINIDO NA CELESC-D</text>
  </g>

  <!-- Headline -->
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="46" fill="#FFFFFF">APROVAR NA</text>
  <text x="60" y="757" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="46" fill="#FFFFFF">CELESC NÃO</text>
  <text x="60" y="828" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="62" fill="#FF7A1A">LEVA ANOS.</text>

  <line x1="60" y1="865" x2="1020" y2="865" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="915" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">Existe um fluxo técnico com</text>
  <text x="60" y="952" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">etapas claras: parecer de acesso,</text>
  <text x="60" y="989" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FFFFFF">projeto, vistoria e troca do medidor.</text>

  <text x="60" y="1042" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Estimativa ilustrativa: projetos bem</text>
  <text x="60" y="1073" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">instruídos, cerca de 2 a 4 meses do</text>
  <text x="60" y="1104" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">protocolo à troca do medidor.</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1260" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="38" fill="#0A2540">DIAGNÓSTICO GRATUITO</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
