<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0D3054"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#FFFFFF">AMPER ENERGIA</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" letter-spacing="1" fill="#C9D6E3">SOLAR FV · BESS · EVSE · SANTA CATARINA</text>
  <rect x="60" y="135" width="90" height="5" fill="#FF7A1A"/>

  <!-- SUSTENTABILIDADE tag -->
  <rect x="60" y="168" width="330" height="42" rx="6" fill="#FF7A1A"/>
  <text x="225" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0A2540" text-anchor="middle">SUSTENTABILIDADE</text>

  <!-- Illustration: diesel generator (fading out) -> arrow -> solar + battery (lit up) -->
  <g transform="translate(90,245)">
    <!-- ground line -->
    <line x1="0" y1="300" x2="440" y2="300" stroke="#3E6890" stroke-width="3"/>

    <!-- Diesel generator (left, fading) -->
    <g transform="translate(10,60)" opacity="0.55">
      <!-- smoke puffs -->
      <circle cx="40" cy="20" r="14" fill="#8899AA"/>
      <circle cx="60" cy="0" r="18" fill="#8899AA"/>
      <circle cx="85" cy="-22" r="22" fill="#8899AA"/>
      <!-- exhaust pipe -->
      <rect x="55" y="40" width="12" height="30" fill="#5A7591"/>
      <!-- generator body -->
      <rect x="0" y="70" width="170" height="130" rx="8" fill="#5A7591" stroke="#C9D6E3" stroke-width="2"/>
      <rect x="20" y="95" width="50" height="35" rx="4" fill="#0F2E4E"/>
      <circle cx="140" cy="150" r="22" fill="#0F2E4E"/>
      <circle cx="140" cy="150" r="10" fill="#5A7591"/>
      <!-- sound waves -->
      <path d="M -20 150 Q -35 140 -20 130" stroke="#C9D6E3" stroke-width="3" fill="none"/>
      <path d="M -32 155 Q -52 140 -32 125" stroke="#C9D6E3" stroke-width="3" fill="none"/>
      <text x="85" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#C9D6E3">DIESEL</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(205,185)">
      <line x1="0" y1="0" x2="55" y2="0" stroke="#FF7A1A" stroke-width="5"/>
      <polygon points="55,-10 75,0 55,10" fill="#FF7A1A"/>
    </g>

    <!-- Solar + BESS (right, lit up) -->
    <g transform="translate(300,55)">
      <!-- sun -->
      <circle cx="70" cy="-20" r="20" fill="#FF7A1A"/>
      <line x1="70" y1="-50" x2="70" y2="-62" stroke="#FF7A1A" stroke-width="4"/>
      <line x1="95" y1="-38" x2="104" y2="-47" stroke="#FF7A1A" stroke-width="4"/>
      <line x1="45" y1="-38" x2="36" y2="-47" stroke="#FF7A1A" stroke-width="4"/>
      <!-- solar panel -->
      <rect x="10" y="10" width="120" height="70" rx="4" fill="#0F2E4E" stroke="#FF7A1A" stroke-width="2"/>
      <line x1="10" y1="33" x2="130" y2="33" stroke="#FF7A1A" stroke-width="1.5"/>
      <line x1="10" y1="56" x2="130" y2="56" stroke="#FF7A1A" stroke-width="1.5"/>
      <line x1="50" y1="10" x2="50" y2="80" stroke="#FF7A1A" stroke-width="1.5"/>
      <line x1="90" y1="10" x2="90" y2="80" stroke="#FF7A1A" stroke-width="1.5"/>
      <!-- battery -->
      <rect x="30" y="100" width="80" height="120" rx="8" fill="#FFFFFF"/>
      <rect x="55" y="88" width="30" height="14" rx="3" fill="#FFFFFF"/>
      <polygon points="78,115 55,170 70,170 62,210 95,150 78,150" fill="#FF7A1A"/>
      <text x="70" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#C9D6E3">FV + BESS</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="60" y="690" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF">MENOS DIESEL,</text>
  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF">MAIS SOL E</text>
  <text x="60" y="815" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="70" fill="#FF7A1A">BATERIA</text>

  <line x1="60" y1="855" x2="1020" y2="855" stroke="#3E6890" stroke-width="2"/>

  <!-- Body -->
  <text x="60" y="905" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">FV + BESS pode substituir parte</text>
  <text x="60" y="940" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">do gerador de contingência da</text>
  <text x="60" y="975" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">sua indústria — menos fumaça e</text>
  <text x="60" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF">ruído dentro do próprio pátio.</text>

  <text x="60" y="1060" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">*Estimativa ilustrativa: 30-60%</text>
  <text x="60" y="1091" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">menos horas/ano de acionamento</text>
  <text x="60" y="1122" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="22" fill="#C9D6E3">do gerador a diesel (varia por projeto).</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="1200" width="1080" height="150" fill="#FF7A1A"/>
  <text x="60" y="1265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#0A2540">VISITA NOSSO SITE 🔗</text>
  <text x="60" y="1315" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#0A2540">@ampenergia</text>
</svg>
